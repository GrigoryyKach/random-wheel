[package]
name = "random_wheel"
version = "1.0.0"
edition = "2024"
build = "build.rs"
description = "Колесо фортуны: случайный выбор участника"

[[bin]]
name = "RandomWheel"
path = "src/main.rs"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
strip = true
lto = true
