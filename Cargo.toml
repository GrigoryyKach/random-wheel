[package]
name = "random_wheel"
version = "1.1.0"
edition = "2024"
build = "build.rs"
description = "Wheel of fortune: pick a random participant"

[[bin]]
name = "RandomWheel"
path = "src/main.rs"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "clipboard", "links"] }
rfd = "0.15.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
strip = true
lto = true
